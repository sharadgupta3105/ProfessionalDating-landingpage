<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="false" name="linkedup-api-proxy"/>
<meta content="http://localhost:5001" name="linkedup-api-url"/>
<meta content="help@matchedin.app" name="linkedup-support-email"/>
<title>Admin Dashboard | MATCHEDIN</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/brand.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body { font-family: "DM Sans", system-ui, sans-serif; background: #f4f1ec; color: #1c1917; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
  .stat-card { background: #fff; border: 1px solid rgba(28,25,23,.08); border-radius: 1rem; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #78716c; padding: 10px 12px; border-bottom: 1px solid #e7e5e4; }
  td { padding: 12px; border-bottom: 1px solid #f5f5f4; font-size: 14px; vertical-align: middle; }
  tr:hover td { background: #fafaf9; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .badge-ok { background: #dcfce7; color: #166534; }
  .badge-warn { background: #fef3c7; color: #92400e; }
  .badge-bad { background: #fee2e2; color: #991b1b; }
  .badge-muted { background: #f5f5f4; color: #57534e; }
  .btn { border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #1c1917; color: #fff; }
  .btn-ghost { background: #fff; border-color: #d6d3d1; color: #1c1917; }
  .btn-danger { background: #fff; border-color: #fecaca; color: #b91c1c; }
  .btn-gold { background: #c9a227; color: #1c1917; }
  input, select { border: 1px solid #d6d3d1; border-radius: 10px; padding: 10px 12px; background: #fff; }
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 50; display: none; }
</style>
</head>
<body>
<!-- Login -->
<section id="login-view" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-lg border border-stone-200 p-8">
    <div class="brand-lockup brand-lockup--nav mb-6 justify-center">
      <img alt="" class="brand-lockup__mark" src="assets/images/logo-heart.png" aria-hidden="true"/>
      <span class="brand-lockup__wordmark"><span class="brand-lockup__matched">MATCHED</span><span class="brand-lockup__in">IN</span></span>
    </div>
    <h1 class="text-2xl font-semibold text-center mb-1">Admin Dashboard</h1>
    <p class="text-sm text-stone-500 text-center mb-6">Manage users, Premium, bans, and reports</p>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-stone-500 mb-1">Username</label>
        <input id="login-user" type="text" autocomplete="username" class="w-full" value="admin" required/>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-stone-500 mb-1">Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" class="w-full" required/>
      </div>
      <p id="login-error" class="text-sm text-red-600 hidden"></p>
      <button type="submit" class="btn btn-primary w-full py-3 text-sm">Sign in</button>
    </form>
    <p id="login-hint" class="text-xs text-stone-400 text-center mt-4"></p>
  </div>
</section>

<!-- Dashboard -->
<section id="dash-view" class="hidden min-h-screen">
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="brand-lockup brand-lockup--nav">
          <img alt="" class="brand-lockup__mark" src="assets/images/logo-heart.png" aria-hidden="true"/>
          <span class="brand-lockup__wordmark"><span class="brand-lockup__matched">MATCHED</span><span class="brand-lockup__in">IN</span></span>
        </div>
        <span class="text-xs font-semibold uppercase tracking-widest text-stone-400">Admin</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="admin-name" class="text-sm text-stone-600"></span>
        <button type="button" id="btn-logout" class="btn btn-ghost">Log out</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <!-- Stats -->
    <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3"></div>

    <!-- Users -->
    <div class="bg-white rounded-2xl border border-stone-200 shadow-sm">
      <div class="p-4 md:p-5 border-b border-stone-100 flex flex-col md:flex-row md:items-center gap-3 justify-between">
        <div>
          <h2 class="text-lg font-semibold">Users</h2>
          <p class="text-sm text-stone-500">Search, grant Premium, ban, or delete</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <input id="user-q" type="search" placeholder="Search email, name, city…" class="min-w-[200px]"/>
          <select id="user-filter">
            <option value="all">All</option>
            <option value="premium">Premium</option>
            <option value="banned">Banned</option>
            <option value="incomplete">Incomplete onboarding</option>
          </select>
          <button type="button" id="btn-refresh" class="btn btn-ghost">Refresh</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>City</th>
              <th>Status</th>
              <th>Premium</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="6" class="text-stone-400 py-8 text-center">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="p-4 flex items-center justify-between text-sm text-stone-500">
        <span id="users-meta"></span>
        <div class="flex gap-2">
          <button type="button" id="btn-prev" class="btn btn-ghost" disabled>Prev</button>
          <button type="button" id="btn-next" class="btn btn-ghost" disabled>Next</button>
        </div>
      </div>
    </div>

    <!-- Reports -->
    <div class="bg-white rounded-2xl border border-stone-200 shadow-sm">
      <div class="p-4 md:p-5 border-b border-stone-100 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold">Reports</h2>
          <p class="text-sm text-stone-500">Latest user reports</p>
        </div>
        <button type="button" id="btn-reports" class="btn btn-ghost">Reload</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>When</th>
              <th>Reporter</th>
              <th>Reported</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody id="reports-tbody">
            <tr><td colspan="4" class="text-stone-400 py-6 text-center">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</section>

<div id="toast" class="bg-stone-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/admin-api.js"></script>
<script src="assets/js/admin-dashboard.js"></script>
</body>
</html>
